# ==========================================
# Fonts
# ==========================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Add a little extra line height for a cleaner, modern look
adjust_line_height  110%

# ==========================================
# Window Layout & Borders
# ==========================================
# This padding is crucial! It keeps text away from the glass edges
window_padding_width 15

# Hide Kitty's default titlebar (Hyprland handles this)
hide_window_decorations yes

# Skip the confirmation prompt when closing the terminal
confirm_os_window_close 0

# ==========================================
# Transparency & Glassmorphism
# ==========================================
# Set to 0.75 to let Hyprland's 3-pass blur do the heavy lifting
background_opacity 0.75
dynamic_background_opacity yes

# ==========================================
# Cursor
# ==========================================
cursor #cccccc
cursor_shape beam
cursor_blink_interval 0.5

# ==========================================
# Color Scheme (Gray-Pastel Aesthetic)
# ==========================================
# Deep charcoal background with soft white text
background #121212
foreground #e6e6e6

selection_background #333333
selection_foreground #ffffff

# Normal Colors (Soft and Minimal)
color0  #262626  # black/dark gray
color1  #e08283  # red (soft rose)
color2  #87b897  # green (soft mint)
color3  #e8c881  # yellow (soft sand)
color4  #7da8d1  # blue (slate blue)
color5  #b287b8  # magenta (lavender)
color6  #7ebbbb  # cyan (soft aqua)
color7  #cccccc  # white (light gray)

# Bright Colors (Slightly more vibrant pastels)
color8  #4d4d4d  # bright black/gray
color9  #e8a2a3  # bright red
color10 #a6cdae  # bright green
color11 #ebd5a0  # bright yellow
color12 #9cbce0  # bright blue
color13 #c5a6cd  # bright magenta
color14 #9cd0d0  # bright cyan
color15 #ffffff  # bright white
