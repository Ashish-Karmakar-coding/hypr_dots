# ==========================================
# Background: Frosted Glass
# ==========================================
background {
    monitor =
    path = screenshot
    # Heavy blur to match your wlogout and Waybar layers
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ==========================================
# Time Display
# ==========================================
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
}

# ==========================================
# Greeting text
# ==========================================
label {
    monitor =
    text = Welcome back, Kenshin
    color = rgba(200, 200, 200, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    
    position = 0, 0
    halign = center
    valign = center
}

# ==========================================
# Password Input Field
# ==========================================
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2 
    dots_spacing = 0.2 
    dots_center = true
    
    # Silver-gray border with dark charcoal glass (matches wlogout)
    outer_color = rgba(166, 166, 166, 0.4) 
    inner_color = rgba(18, 18, 18, 0.65)
    font_color = rgb(200, 200, 200)
    
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font Bold
    placeholder_text = <i><span foreground="##a6a6a6">Password...</span></i>
    hide_input = false
    
    position = 0, -80
    halign = center
    valign = center
}
