################
### MONITORS ###
################

# External Monitor (Primary) at 0,0
monitor = HDMI-A-1, 1920x1080@200, 0x0, 1
# Laptop Display (Secondary) placed to the right
monitor = eDP-1, 1920x1080@144, 1920x0, 1.30

##################
## MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = hyprlauncher


#################
### AUTOSTART ###
#################

exec-once = waybar & hyprpaper & swww-daemon & swaync

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################




#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(ffffff1a)
    col.inactive_border = rgba(0000001a)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    # --- Edges & Corners ---
    rounding = 7          # Smooth, modern rounded corners (macOS/Windows 11 style)
    
    # --- Transparency ---
    active_opacity = 1  
    inactive_opacity = 0.9 
    fullscreen_opacity = 1.0 # Keep fullscreen apps (like games/video) completely solid

    # --- Glassmorphism (The Blur Effect) ---
    blur {
        enabled = true
        size = 3           # How wide the blur spreads
        passes = 2         # Higher passes = much smoother, premium frosted glass look
        new_optimizations = true
        ignore_opacity = true # Forces the blur to render *behind* transparent windows
        xray = false       # Keeps windows from showing through each other messily
        vibrancy = 0.2     # Adds a very subtle color boost to the blurred background
    }

    # --- Depth & Floating Effect ---
    shadow {
        enabled = true
        range = 20         # How far the shadow spreads
        render_power = 3   # How smooth the shadow falloff is
        color = rgba(00000066) # A soft, semi-transparent black shadow
        color_inactive = rgba(00000033) # Even softer shadow for background windows
    }

    # --- Dimming ---
    dim_inactive = false   # Set to true if you want background windows to darken slightly
    dim_strength = 0.1
}

animations {
    enabled = true

    # --- Premium Bezier Curves ---
    # These control the acceleration of the animation. 
    # 'expo' gives a smooth, high-end glide. 'overshot' adds a tiny, satisfying spring.
    bezier = expo, 0.16, 1, 0.3, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    
    # --- Animation Rules ---
    # Format: animation = NAME, ON/OFF, SPEED (1=fastest), CURVE, STYLE
    
    # Window opening/closing
    animation = windows, 1, 5, expo, popin 80%     # Windows scale up smoothly from 80%
    animation = windowsOut, 1, 5, expo, popin 80%  # Windows shrink as they close
    animation = windowsMove, 1, 5, overshot        # A very slight, soft spring when moving windows
    
    # Fading and Borders
    animation = fade, 1, 4, expo                   # Smooth fade-in for transparent windows
    animation = border, 1, 3, default              # Smooth transition if your border color changes
    
    # Workspaces
    animation = workspaces, 1, 6, expo, slide      # Workspaces glide elegantly left/right
    animation = specialWorkspace, 1, 6, expo, slidevert # Scratchpads glide up from the bottom
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

#############
####INPUT####
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}
gesture = 3, horizontal, workspace
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

$path = ~/.config/waybar/scripts
bind = SUPER, O, exec, kitty -e $path/power
bind = SUPER, U, exec, kitty -e $path/update

binde = SHIFT, right, exec, brightnessctl set 5%+
binde = SHIFT, left, exec, brightnessctl set 5%-

# Volume Up (Shift + Up)
bind = SHIFT, UP, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%

# Volume Down (Shift + Down)
bind = SHIFT, DOWN, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

bindel = , XF86MonBrightnessDown, exec, $path/backlight down
bindel = , XF86MonBrightnessUp,   exec, $path/backlight up

# Toggle off bluetooth/wifi
bind = SUPER ALT, B, exec, $path/bluetooth off
bind = SUPER ALT, N, exec, $path/network off

bind = $mainMod, Escape, exec, wlogout
bind = $mainMod, X, killactive
bind = $mainMod, T, exec, kitty
bind = $mainMod, B, exec, brave
bind = $mainMod, F, exec, rofi -show drun
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wall-cycle.sh # To change the wallpaper
bind = $mainMod, L, exec, hyprlock
bind = , PRINT, exec, hyprshot -m output # to take screenshot of an entire monitor
bind = SHIFT, PRINT , exec,  hyprshot -m region # to take screenshot of a selected region
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,

# To fullscreen a window
bind = $mainMod, up, fullscreen, 0

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# To toggle between the workspaces
bind = $mainMod, Tab, workspace, previous
# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

### To toggle the cores of CPU
$cpuScript = sudo /home/kenshin/.config/hypr/scripts/toggle_cores.sh

# Bindings for 1 to 9 cores
bind = $mainMod ALT, 1, exec, $cpuScript 1
bind = $mainMod ALT, 2, exec, $cpuScript 2
bind = $mainMod ALT, 3, exec, $cpuScript 3
bind = $mainMod ALT, 4, exec, $cpuScript 4
bind = $mainMod ALT, 5, exec, $cpuScript 5
bind = $mainMod ALT, 6, exec, $cpuScript 6
bind = $mainMod ALT, 7, exec, $cpuScript 7
bind = $mainMod ALT, 8, exec, $cpuScript 8
bind = $mainMod ALT, 9, exec, $cpuScript 9

# Bind 0 to Maximum cores
bind = $mainMod ALT, 0, exec, $cpuScript 100


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}


windowrule {
    name = wifi-popup
    match:initial_class = ^nmrs-gui$
    match:class = ^nmrs-gui$
    
    # Static rules must have 'on' or '1'
    float = on
    size = 600 500
    center = on
}

