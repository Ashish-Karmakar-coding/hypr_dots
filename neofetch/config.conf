# Neofetch Theme: Monochrome Minimalist

print_info() {
    info title
    info underline

    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "WM" wm
    info "Terminal" term
    info "Memory" memory
}

# --- Color Configuration ---
# Color order: title, @, underline, subtitle (keys), colon, info (values)
# 8 = Dark Gray, 7 = Light Gray, 15 = Bright White
colors=(15 7 8 8 8 15)

# ASCII Colors (Forces the Arch Logo to Silver and White)
ascii_colors=(8 15)

# --- Text Formatting ---
# Makes the separator a clean, minimal arrow instead of a colon
separator=" ➜"

# Hides the architecture (x86_64) next to the OS name
os_arch="off"

# Makes uptime output shorter (e.g., "2h 15m" instead of "2 hours, 15 mins")
uptime_shorthand="on"

# Hides the total memory output, showing only used memory percentage
memory_percent="on"

# Hides package manager names, just shows the total number
package_managers="off"

# Clean up shell output
shell_path="off"
shell_version="off"

# Disable block display at the bottom (keeps the minimal look)
block_range=()
color_blocks="off"

# Ensure the ASCII art is drawn correctly
image_backend="ascii"
ascii_distro="arch_small" 
ascii_bold="on"
